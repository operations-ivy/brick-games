# Where each device keeps its saves, for the save agent (saves_agent.py, which
# asks the saves service for its device's part: /api/saves/config?device=).
#
#   roots:  folders to look in for saves
#     path:      the folder (~ is the agent's home on brick9000)
#     match:     file name patterns (fnmatch), e.g. "*.srm"
#     recursive: also look in subfolders (RetroArch's per-core folders)
#     system:    the system every save here belongs to; without it, a save
#                is matched to a game across all systems by its name
#     strip:     a suffix the emulator adds to the game's name ("_1": card 1)
#     write:     how a new save is named here, from the ROM's stem: only the
#                first root with `write` for a save's kind gets new saves; a
#                map of system -> name where RetroArch keeps a folder per core
#                (a system it doesn't name gets no new saves)
#     kind:      sram (battery saves) or ps1 (memory cards); default: both;
#                state: RetroArch's states, of which only slot 10 is shared
#                (match "*.state10"; slots 0-9 stay on the device)
#   cores:  system -> the core this device runs it with, for state slot 10: a
#           state only loads in the core that made it, so it's written only
#           onto a device with the same core; a system not named here keeps
#           its states to itself
#   skip:   systems this device doesn't sync (Dreamcast until every device
#           plays it in Flycast: brick-games#20)
#   roms:   folders whose ROM names a new save takes (a device's names can
#           differ from brick2000's); without it, the catalog's names
#
# Checked 2026-11-21: brick9000 (RetroArch, sort_savefiles off: one flat
# folder; PCSX-ReARMed's PS1 cards are .srm there too) and the Retroid
# (RetroArch saves in RetroArch/saves, a few older ones beside the ROMs on
# the SD card; DuckStation cards per game) and the RG476H (RetroArch saves
# in one flat folder, DuckStation's cards in its app folder, ROMs on the SD
# card).
#
# State slot 10 (2026-11-24): brick9000's cores from its RetroArch playlists
# (states flat in ~/games/states, brick-cicd-config's retroarch.cfg); the
# RG476H's from RetroArch's play logs (Snes9x, Genesis Plus GX, FinalBurn
# Neo) and FCEUmm for NES (rg476h.md), states flat in RetroArch/states; its
# other systems aren't checked yet. The Retroid isn't set up for states yet.

devices:
  brick9000:
    name: brick9000
    roots:
      - {path: "~/games/saves", match: ["*.srm"], write: "{stem}.srm"}
      - {path: "~/games/states", match: ["*.state10"], kind: state, write: "{stem}.state10"}
    cores:
      nes: Nestopia
      snes: Snes9x
      gb: Gambatte
      gba: mGBA
      megadrive: Genesis Plus GX
      gamegear: Genesis Plus GX
      sega32x: PicoDrive
      segacd: PicoDrive
      pce: Beetle PCE Fast
      neogeo: FinalBurn Neo
      psx: PCSX-ReARMed
    skip: [dreamcast]
    roms:
      - "~/games/roms"
  rp2plus:
    name: Retroid Pocket 2+
    roots:
      # RetroArch sorts saves into a folder per core (checked 2026-11-21); the
      # .srm files at the top are from before.
      - path: "/storage/emulated/0/RetroArch/saves"
        match: ["*.srm"]
        recursive: true
        kind: sram
        write:
          nes: "FCEUmm/{stem}.srm"
          snes: "Snes9x/{stem}.srm"
          gb: "Gambatte/{stem}.srm"
          gba: "mGBA/{stem}.srm"
          n64: "Mupen64Plus-Next/{stem}.srm"
          megadrive: "Genesis Plus GX/{stem}.srm"
          segacd: "Genesis Plus GX/{stem}.srm"
          sega32x: "PicoDrive/{stem}.srm"
          pce: "Beetle PCE Fast/{stem}.srm"
          neogeo: "FinalBurn Neo/{stem}.srm"
          arcade: "FinalBurn Neo/{stem}.srm"
      - {path: "/storage/FA06-BE3E/RetroidPocketGames/ROMs", match: ["*.srm"], recursive: true, kind: sram}
      - {path: "/storage/emulated/0/duckstation/memcards", match: ["*_1.mcd"], system: psx, strip: "_1",
         kind: ps1, write: "{stem}_1.mcd"}
    skip: [dreamcast]
    roms:
      - "/storage/FA06-BE3E/RetroidPocketGames/ROMs"
  rg476h:
    name: RG476H
    roots:
      - {path: "/sdcard/RetroArch/saves", match: ["*.srm"], recursive: true, kind: sram, write: "{stem}.srm"}
      - {path: "/sdcard/Android/data/com.github.stenzek.duckstation/files/memcards", match: ["*_1.mcd"],
         system: psx, strip: "_1", kind: ps1, write: "{stem}_1.mcd"}
      - {path: "/sdcard/RetroArch/states", match: ["*.state10"], kind: state, write: "{stem}.state10"}
    cores:
      nes: FCEUmm
      snes: Snes9x
      megadrive: Genesis Plus GX
      neogeo: FinalBurn Neo
      arcade: FinalBurn Neo
    # N64 is M64Plus FZ Pro and DS is DraStic there: neither keeps RetroArch saves.
    skip: [dreamcast, n64, nds]
    roms:
      - "/storage/6135-6334/ROMs"
