<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brick games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #04050a; --panel: #0a0e19; --grid: #0e1630; --edge: #1a2442;
    --text: #c9f3ff; --dim: #5b7799; --slate: #6c7c95;
    --cyan: #00eaff; --magenta: #ff2bd6; --green: #39ff6a; --amber: #ffb300; --red: #ff3355;
    --pixel: 'Silkscreen', 'Courier New', monospace;
    --ui: 'Rajdhani', 'Segoe UI', sans-serif;
    --mono: 'Share Tech Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--void); color: var(--text); font-family: var(--ui); font-size: 16px; }
  body::after { /* the CRT: faint scanlines over everything */
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 3px);
  }
  header { position: sticky; top: 0; z-index: 10; background: linear-gradient(var(--void) 80%, rgba(4,5,10,0));
           padding: 14px 16px 10px; }
  .title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-family: var(--pixel); font-size: 26px; letter-spacing: 2px; color: var(--cyan);
       text-shadow: 0 0 8px rgba(0,234,255,.7), 0 0 22px rgba(255,43,214,.35); }
  .count { font-family: var(--mono); color: var(--dim); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  input[type=search], select {
    background: var(--panel); color: var(--text); border: 1px solid var(--edge); border-radius: 6px;
    font: 600 16px var(--ui); padding: 8px 10px; outline: none; }
  input[type=search] { flex: 1 1 260px; min-width: 0; }
  input[type=search]:focus, select:focus { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 12px rgba(0,234,255,.35); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font: 700 12px var(--pixel); letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
          padding: 5px 9px; border-radius: 4px; border: 1px solid var(--edge); background: var(--panel); color: var(--slate); }
  .chip:hover { color: var(--text); }
  .chip.on { color: var(--void); background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,234,255,.5); }
  .chip .n { font-family: var(--mono); opacity: .75; margin-left: 4px; }
  main { padding: 6px 16px 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; cursor: pointer;
          display: flex; flex-direction: column; transition: transform .12s, box-shadow .12s, border-color .12s; }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--magenta);
          box-shadow: 0 0 14px rgba(255,43,214,.45); outline: none; }
  .art { aspect-ratio: 3 / 4; background: var(--grid); display: flex; align-items: center; justify-content: center; }
  .art img { width: 100%; height: 100%; object-fit: contain; }
  .art .none { font: 700 13px var(--pixel); color: var(--dim); text-align: center; padding: 8px; }
  .meta { padding: 8px 9px 10px; }
  .name { font-weight: 700; font-size: 15px; line-height: 1.15; }
  .sub { font: 12px var(--mono); color: var(--dim); margin-top: 3px; }
  .more { display: block; margin: 22px auto 0; }
  button { font: 700 13px var(--pixel); letter-spacing: 1px; background: var(--panel); color: var(--cyan);
           border: 1px solid var(--cyan); border-radius: 6px; padding: 9px 14px; cursor: pointer; }
  button:hover { box-shadow: 0 0 12px rgba(0,234,255,.5); }
  .empty, .note { font-family: var(--mono); color: var(--dim); padding: 30px 0; text-align: center; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--magenta); border-radius: 10px;
           box-shadow: 0 0 30px rgba(255,43,214,.35); padding: 0; width: min(880px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(4,5,10,.85); }
  .dlg { display: grid; grid-template-columns: minmax(0, 280px) 1fr; gap: 18px; padding: 18px; }
  @media (max-width: 640px) { .dlg { grid-template-columns: 1fr; } }
  .dlg h2 { margin: 0 0 4px; font-size: 26px; line-height: 1.1; }
  .dlg .sys { font: 700 12px var(--pixel); color: var(--magenta); letter-spacing: 1px; }
  .shots { display: flex; gap: 8px; margin-top: 8px; }
  .shots img { width: 50%; border: 1px solid var(--edge); border-radius: 4px; image-rendering: pixelated; }
  .box img { width: 100%; border-radius: 6px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 14px 0; font-family: var(--mono); font-size: 14px; }
  dt { color: var(--dim); }
  .plays { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
  .badge { font: 12px var(--mono); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--edge); }
  .badge.good { color: var(--green); border-color: var(--green); }
  .badge.ok { color: var(--amber); border-color: var(--amber); }
  .badge.no { color: var(--slate); text-decoration: line-through; }
  .score { color: var(--green); }
  .score.mid { color: var(--amber); }
  .score.low { color: var(--red); }
  .score.few { opacity: .45; }
  .files { font: 12px var(--mono); color: var(--dim); max-height: 110px; overflow: auto; white-space: pre; margin-top: 10px; }
  a { color: var(--cyan); }
  .close { position: absolute; top: 10px; right: 10px; }
  h3 { font: 700 12px var(--pixel); letter-spacing: 1px; color: var(--slate); margin: 10px 0 4px; }
  .links { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .lan { margin-top: 8px; }
  .grade { font: 12px var(--mono); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--edge); margin-left: 6px; }
  .grade.complete { color: var(--green); border-color: var(--green); }
  .grade.partial, .grade.hand-saved { color: var(--amber); border-color: var(--amber); }
  .grade.stub { color: var(--red); border-color: var(--red); }
  .reader { padding: 18px; }
  .reader .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 90px 10px 0; }
  .reader h2 { margin: 0; font-size: 22px; }
  .reader .warn { font: 13px var(--mono); color: var(--amber); margin: 0 0 10px; }
  .reader .cols { display: grid; grid-template-columns: minmax(0, 240px) 1fr; gap: 14px; }
  @media (max-width: 640px) { .reader .cols { grid-template-columns: 1fr; } .reader .toc { max-height: 160px; } }
  .reader .toc { max-height: 65vh; overflow: auto; font: 13px var(--mono); border-right: 1px solid var(--edge); padding-right: 8px; }
  .reader .toc a { display: block; padding: 2px 0; text-decoration: none; }
  .reader .toc a.l3 { padding-left: 12px; color: var(--dim); }
  .reader .body { max-height: 65vh; overflow: auto; }
  .reader .body h3 { font-size: 14px; color: var(--magenta); margin: 16px 0 6px; }
  .reader .body h4 { font: 700 14px var(--mono); color: var(--cyan); margin: 12px 0 4px; }
  .reader .body p { white-space: pre-wrap; margin: 0 0 8px; line-height: 1.45; }
  .reader input { font: 14px var(--mono); background: var(--void); color: var(--text); border: 1px solid var(--edge);
                  border-radius: 6px; padding: 6px 8px; width: 100%; box-sizing: border-box; margin-bottom: 8px; }
  .reader .src { font: 12px var(--mono); color: var(--dim); }
  .saves { font: 13px var(--mono); }
  .saves table { border-collapse: collapse; width: 100%; margin: 4px 0; }
  .saves td { padding: 3px 8px 3px 0; vertical-align: top; }
  .saves .ok { color: var(--green); } .saves .behind { color: var(--amber); } .saves .clash { color: var(--red); }
  .saves .pick { border: 1px solid var(--red); border-radius: 6px; padding: 8px; margin: 6px 0; }
  .saves .pick p { margin: 0 0 6px; color: var(--red); }
  .saves button { padding: 4px 8px; font-size: 11px; }
  .saves details { margin-top: 6px; color: var(--dim); }
  .alert { font: 700 12px var(--pixel); letter-spacing: 1px; color: var(--red); border: 1px solid var(--red);
           border-radius: 6px; padding: 4px 8px; margin-left: 10px; cursor: pointer; background: none; }
</style>
</head>
<body>
<header>
  <div class="title"><h1>BRICK GAMES</h1><span class="count" id="count">loading…</span>
    <button class="alert" id="clash" hidden></button></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search titles, developers, genres…" autocomplete="off">
    <select id="device" aria-label="Plays on">
      <option value="">Any device</option>
    </select>
    <select id="genre" aria-label="Genre"><option value="">Any genre</option></select>
    <select id="rating" aria-label="Rating">
      <option value="">Any rating</option><option value="90">90 and up</option><option value="80">80 and up</option>
      <option value="70">70 and up</option><option value="60">60 and up</option>
      <option value="rated">Rated (10+ reviews)</option><option value="unrated">Not rated</option>
    </select>
    <select id="sort" aria-label="Sort">
      <option value="title">A–Z</option><option value="year">Oldest first</option><option value="-year">Newest first</option><option value="-score">Best rated</option>
    </select>
  </div>
  <div class="chips" id="systems"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No games match.</div>
  <button class="more" id="more" hidden>MORE</button>
</main>
<dialog id="dlg"></dialog>
<script>
"use strict";
const PAGE = 120;
let cat = null, shown = 0, matches = [];
const state = { q: "", system: "", device: "", genre: "", rating: "", sort: "title" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function load() {
  const r = await fetch("/api/catalog");
  if (!r.ok) { $("count").textContent = "the first scan hasn't finished yet"; return; }
  cat = await r.json();
  cat.bySystem = Object.fromEntries(cat.systems.map((s) => [s.id, s]));
  for (const g of cat.games) {
    g.hay = [g.title, g.genre, g.developer, g.publisher, cat.bySystem[g.system].name].join(" ").toLowerCase();
  }
  for (const [k] of KINDS) {
    const xs = cat.games.map((g) => g[k]).filter((v) => v != null);
    MEAN[k] = xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0;
  }
  for (const g of cat.games) g.rank = ranked(g);
  for (const [id, d] of Object.entries(cat.devices)) {
    $("device").insertAdjacentHTML("beforeend", `<option value="${esc(id)}">Plays on ${esc(d.name)}</option>`);
  }
  const genres = [...new Set(cat.games.map((g) => g.genre).filter(Boolean))].sort();
  for (const g of genres) $("genre").insertAdjacentHTML("beforeend", `<option>${esc(g)}</option>`);
  chips();
  conflicts();
  readHash();
  render();
}

function chips() {
  const all = `<span class="chip ${state.system ? "" : "on"}" data-s="">All<span class="n">${cat.games.length}</span></span>`;
  $("systems").innerHTML = all + cat.systems.map((s) =>
    `<span class="chip ${state.system === s.id ? "on" : ""}" data-s="${esc(s.id)}">${esc(s.name)}<span class="n">${s.count}</span></span>`).join("");
}

// Any score at all: the Metascore, else the critics' average (IGDB), else
// IGDB's users. 0-100.
const score = (g) => g.metascore ?? g.critics ?? g.users ?? null;

// What "Best rated" and the rating filter use (the user, 2026-11-18): a score
// counts only from MIN_REVIEWS reviews up, and is then pulled toward the
// catalog's average for its kind as if it had PRIOR_REVIEWS more average
// reviews (a Bayesian average): a 100 from 10 reviews ranks about 85, from 50
// about 95. The Metascore counts as it is (Metacritic needs several reviews to
// give one). A game with no score that counts isn't rated here; its card
// still shows its score, dimmed.
const MIN_REVIEWS = 10, PRIOR_REVIEWS = 10;
const KINDS = [["critics", "critic_reviews"], ["users", "user_reviews"]];
const MEAN = {};  // kind -> the catalog's average score, set in load()
// The score that counts: [kind, score, reviews], or null.
function counted(g) {
  if (g.metascore != null) return ["metascore", g.metascore, null];
  for (const [k, n] of KINDS) {
    if (g[k] != null && (g[n] ?? 0) >= MIN_REVIEWS) return [k, g[k], g[n]];
  }
  return null;
}
function ranked(g) {
  const c = counted(g);
  if (!c) return null;
  const [kind, s, n] = c;
  return n === null ? s : (n * s + PRIOR_REVIEWS * MEAN[kind]) / (n + PRIOR_REVIEWS);
}
// The score a card shows: the one that counts, else any score (dimmed).
const cardScore = (g) => counted(g)?.[1] ?? score(g);
const tone = (n) => (n >= 75 ? "score" : n >= 50 ? "score mid" : "score low");
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

// The rating filter: a floor on the ranked score, or rated / not rated.
function meetsRating(g) {
  const s = g.rank;
  if (!state.rating) return true;
  if (state.rating === "rated") return s !== null;
  if (state.rating === "unrated") return s === null;
  return s !== null && s >= Number(state.rating);
}

function playable(g, device) {
  const v = cat.bySystem[g.system].devices[device];
  return v === "good" || v === "ok";
}

function filter() {
  const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  matches = cat.games.filter((g) =>
    (!state.system || g.system === state.system) &&
    (!state.device || playable(g, state.device)) &&
    (!state.genre || g.genre === state.genre) &&
    meetsRating(g) &&
    words.every((w) => g.hay.includes(w)));
  const year = (g) => parseInt(g.year) || (state.sort === "year" ? 9999 : 0);
  if (state.sort === "year") matches.sort((a, b) => year(a) - year(b) || a.title.localeCompare(b.title));
  else if (state.sort === "-year") matches.sort((a, b) => year(b) - year(a) || a.title.localeCompare(b.title));
  else if (state.sort === "-score") matches.sort((a, b) => (b.rank ?? -1) - (a.rank ?? -1) || a.title.localeCompare(b.title));
  else matches.sort((a, b) => a.title.localeCompare(b.title));
}

function card(g) {
  const pic = g.art.box || g.art.title || g.art.snap;
  const art = pic ? `<img loading="lazy" src="/media/${esc(pic)}" alt="">` : `<div class="none">${esc(g.title)}</div>`;
  const sub = esc([cat.bySystem[g.system].name, g.year].filter(Boolean).join(" · "));
  const s = cardScore(g);
  const few = g.rank === null;
  const hint = few ? ` title="fewer than ${MIN_REVIEWS} reviews: not used for Best rated"` : "";
  const rated = s === null ? "" : ` · <span class="${tone(s)}${few ? " few" : ""}"${hint}>${s}</span>`;
  return `<div class="card" tabindex="0" data-id="${esc(g.id)}"><div class="art">${art}</div>
    <div class="meta"><div class="name">${esc(g.title)}</div><div class="sub">${sub}${rated}</div></div></div>`;
}

function render() {
  filter();
  shown = 0;
  $("grid").innerHTML = "";
  more();
  $("count").textContent = `${matches.length} of ${cat.games.length} games · ${cat.systems.length} systems`;
  $("empty").hidden = matches.length > 0;
  writeHash();
}

function more() {
  const next = matches.slice(shown, shown + PAGE);
  $("grid").insertAdjacentHTML("beforeend", next.map(card).join(""));
  shown += next.length;
  $("more").hidden = shown >= matches.length;
}

function open(id) {
  const g = cat.games.find((x) => x.id === id);
  if (!g) return;
  const s = cat.bySystem[g.system];
  const facts = [["Year", g.year], ["Genre", g.genre], ["Players", g.players], ["Developer", g.developer],
                 ["Publisher", g.publisher], ["Discs", g.discs > 1 ? g.discs : null]]
    .filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
  const rated = (n, note) => `<span class="${tone(n)}">${n}</span> <span class="sub">${esc(note)}</span>`;
  const scores = [
    ["Metascore", g.metascore != null && rated(g.metascore, "Metacritic, via RAWG")],
    ["Critics", g.critics != null && rated(g.critics, `IGDB, ${plural(g.critic_reviews ?? 0, "review")}`)],
    ["Users", g.users != null && rated(g.users, `IGDB, ${plural(g.user_reviews ?? 0, "rating")}`)],
    ["Ranked", score(g) != null && (g.rank !== null ? rated(Math.round(g.rank), "for Best rated, weighted by reviews")
                                     : `<span class="sub">not ranked: fewer than ${MIN_REVIEWS} reviews</span>`)],
  ].filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  const plays = Object.entries(cat.devices).map(([id, d]) => {
    const v = s.devices[id] || "no";
    const word = { good: "plays", ok: "mostly", no: "no" }[v];
    return `<span class="badge ${v}" title="${esc(d.what)}">${esc(d.name)}: ${word}</span>`;
  }).join("");
  // A kept manual opens from the LAN (manuals.py); otherwise, a search on the Internet Archive.
  const manual = g.manual
    ? `<a href="/media/${esc(g.manual)}" target="_blank" rel="noopener">Manual (PDF) ↗</a>`
    : `<a href="https://archive.org/search?query=${encodeURIComponent(`${g.title} ${s.name} manual`)}"
         target="_blank" rel="noopener">Find the manual ↗</a>`;
  // Guides (guides.py): GameFAQs' page for the game (its Guides tab) when Wikidata knows it, else a
  // GameFAQs search; StrategyWiki's walkthrough when there is one. Only for the systems with guides.
  const gf = g.guides?.gamefaqs, sw = g.guides?.strategywiki;
  const guides = s.guides ? `<h3>Guides</h3><div class="links">${gf
      ? `<a href="https://gamefaqs.gamespot.com/-/${encodeURIComponent(gf)}-" target="_blank" rel="noopener">Guides on GameFAQs ↗</a>`
      : `<a href="https://gamefaqs.gamespot.com/search?game=${encodeURIComponent(g.title)}" target="_blank" rel="noopener">Find guides on GameFAQs ↗</a>`}${sw
      ? `<a href="https://strategywiki.org/wiki/${encodeURI(sw)}" target="_blank" rel="noopener">StrategyWiki walkthrough ↗</a>` : ""}</div>` : "";
  // A local walkthrough (strategy.py), read on the LAN; its grade is StrategyWiki's completion stage.
  const st = g.strategy;
  const local = st ? `<div class="lan"><button id="read">READ THE GUIDE</button><span class="grade ${esc(st.grade)}">${esc(st.grade)}</span>
      <span class="sub">${plural(st.sections, "section")}</span></div>` : "";
  const shots = ["title", "snap"].filter((k) => g.art[k]).map((k) => `<img src="/media/${esc(g.art[k])}" alt="${k}">`).join("");
  $("dlg").innerHTML = `<button class="close" id="x">CLOSE</button><div class="dlg">
    <div class="box">${g.art.box ? `<img src="/media/${esc(g.art.box)}" alt="box art">` : ""}<div class="shots">${shots}</div></div>
    <div><div class="sys">${esc(s.name)}</div><h2>${esc(g.title)}</h2>
      <dl>${facts}${scores}</dl>
      <h3>Plays on</h3><div class="plays">${plays}</div>
      ${manual}
      ${guides}${local}
      <h3>Saves</h3><div class="saves" id="saves">checking…</div>
      <h3>Files</h3><div class="files">${g.files.map(esc).join("\n")}</div></div></div>`;
  $("x").onclick = () => $("dlg").close();
  if (st) $("read").onclick = () => reader(g);
  if (!$("dlg").open) $("dlg").showModal();
  showSaves(g);
}

// Saves (saves.py, the saves service behind /api/saves): each device's copy, the history, and, when
// devices disagree, the user's pick of the version to keep (nothing is chosen for them).
const when = (t) => t ? new Date(t * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "";
const bytes = (n) => n >= 1024 ? `${Math.round(n / 1024)} KiB` : `${n} B`;
let saveDevices = {};
async function showSaves(g) {
  const box = $("saves");
  let s;
  try {
    const r = await fetch(`/api/saves/${g.id}`);
    if (!r.ok) throw new Error(r.status);
    s = await r.json();
  } catch { box.textContent = "The save sync isn't answering."; return; }
  if (!$("saves") || $("saves") !== box) return;  // the dialog moved on
  if (!s.head) { box.textContent = "No saves synced yet."; return; }
  const name = (d) => saveDevices[d] || d;
  const byWhom = (sha) => (s.versions[sha]?.from || []).map(name).join(", ");
  // What's in a version (save_decode): a blank one is flagged so it's never the easy pick.
  const inside = (sha) => { const a = (s.about || {})[sha] || {};
    return `<td class="${a.blank ? "clash" : ""}">${esc(a.summary || "")}</td>`; };
  const rows = Object.entries(s.devices).map(([d, v]) => {
    const tag = s.conflict.includes(v.sha) && s.conflict.length ? ["clash", "in conflict"]
      : v.sha === s.head ? ["ok", "in sync"] : ["behind", "behind"];
    return `<tr><td>${esc(name(d))}</td><td class="${tag[0]}">${tag[1]}</td><td>${esc(v.name)}</td>${inside(v.sha)}<td>${when(v.at)}</td></tr>`;
  }).join("");
  const pick = s.conflict.length ? `<div class="pick"><p>Devices have different saves. Which one do you keep?
      The others stay in the history; no device is overwritten until you pick.</p><table>${s.conflict.map((sha) => {
      const v = s.versions[sha];
      return `<tr><td>${esc(byWhom(sha))}</td>${inside(sha)}<td>${bytes(v.size)}</td><td>${when(v.first)}</td>
        <td><a href="/api/saves/${g.id}/${sha}">download</a></td>
        <td><button data-keep="${sha}">KEEP THIS ONE</button></td></tr>`;
    }).join("")}</table></div>` : "";
  const history = Object.entries(s.versions).sort((a, b) => b[1].first - a[1].first).map(([sha, v]) =>
    `<tr><td>${when(v.first)}</td><td>${esc(byWhom(sha))}</td>${inside(sha)}<td>${bytes(v.size)}</td>
      <td>${sha === s.head ? "current" : ""}</td><td><a href="/api/saves/${g.id}/${sha}">download</a></td></tr>`).join("");
  box.innerHTML = `${pick}<table>${rows}</table>
    <details><summary>History (${Object.keys(s.versions).length})</summary><table>${history}</table></details>`;
  box.onclick = async (e) => {
    const b = e.target.closest("[data-keep]"); if (!b) return;
    b.disabled = true;
    await fetch(`/api/saves/${g.id}/keep`, { method: "POST", body: JSON.stringify({ sha: b.dataset.keep }) });
    showSaves(g);
    conflicts();
  };
}
async function conflicts() {
  try {
    const r = await fetch("/api/saves");
    if (!r.ok) return;
    const all = await r.json();
    saveDevices = all.devices || {};
    const waiting = all.games.filter((x) => x.conflict);
    $("clash").hidden = !waiting.length;
    $("clash").textContent = `${waiting.length} SAVE ${waiting.length === 1 ? "CONFLICT" : "CONFLICTS"}`;
    $("clash").onclick = () => open(waiting[0].game);
  } catch { /* the save sync is optional for the page */ }
}

// The guide reader: its contents, a search over its sections (/api/guides/<id>/search), and the text.
const GRADE_NOTE = {
  partial: "StrategyWiki marks this guide as unfinished: later parts of the game may be missing.",
  stub: "StrategyWiki marks this guide as barely begun: expect little beyond the basics.",
  "hand-saved": "A guide saved by hand; no StrategyWiki walkthrough was found.",
};
function mdToHtml(md) {
  return md.split(/\n{2,}/).map((block) => {
    const h = block.match(/^(#{2,6}) (.*)$/);
    if (h) return h[1].length <= 2 ? `<h3>${esc(h[2])}</h3>` : `<h4>${esc(h[2])}</h4>`;
    if (block.startsWith("# ")) return "";
    return `<p>${esc(block)}</p>`;
  }).join("");
}
async function reader(g) {
  const [meta, md] = await Promise.all([
    fetch(`/api/guides/${g.id}`).then((r) => r.json()),
    fetch(`/api/guides/${g.id}/text`).then((r) => r.text()),
  ]);
  const body = (sections) => sections.map((s) => `<div id="s${s.start}">${mdToHtml(md.slice(s.start, s.end))}</div>`).join("");
  const toc = meta.sections.filter((s) => s.level <= 3)
    .map((s) => `<a href="#" class="l${s.level}" data-s="${s.start}">${esc(s.title)}</a>`).join("");
  const note = GRADE_NOTE[meta.grade];
  $("dlg").innerHTML = `<button class="close" id="x">BACK</button><div class="reader">
    <div class="top"><h2>${esc(g.title)}</h2><span class="grade ${esc(meta.grade)}">${esc(meta.grade)}</span></div>
    ${note ? `<p class="warn">${esc(note)}</p>` : ""}
    <div class="cols"><div><input type="search" id="gq" placeholder="Where are you? e.g. second boss, key, password" autocomplete="off">
      <div class="toc" id="toc">${toc}</div></div>
      <div class="body" id="gbody">${body(meta.sections)}</div></div>
    <p class="src">${meta.source ? `From <a href="${esc(meta.source)}" target="_blank" rel="noopener">StrategyWiki</a>, by its contributors, under ${esc(meta.license)}.` : "Saved by hand."}</p></div>`;
  $("x").onclick = () => open(g.id);
  $("toc").onclick = (e) => {
    const a = e.target.closest("a"); if (!a) return;
    e.preventDefault();
    const el = document.getElementById(`s${a.dataset.s}`);
    if (el) $("gbody").scrollTop = el.offsetTop - $("gbody").offsetTop;
  };
  let t;
  $("gq").oninput = (e) => {
    clearTimeout(t);
    t = setTimeout(async () => {
      const q = e.target.value.trim();
      if (!q) { $("gbody").innerHTML = body(meta.sections); return; }
      const found = await fetch(`/api/guides/${g.id}/search?q=${encodeURIComponent(q)}`).then((r) => r.json());
      $("gbody").innerHTML = found.sections.length ? found.sections.map((s) => mdToHtml(s.text)).join("<hr>")
        : `<p class="sub">Nothing in the guide matches.</p>`;
      $("gbody").scrollTop = 0;
    }, 200);
  };
}

// A click outside the box closes it: the backdrop's clicks land on the dialog itself. Only when the
// press began outside too, so selecting text in it and letting go past its edge doesn't close it.
function outside(e) {
  const r = $("dlg").getBoundingClientRect();
  return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
}
let pressedOutside = false;
$("dlg").addEventListener("pointerdown", (e) => { pressedOutside = outside(e); });
$("dlg").addEventListener("click", (e) => { if (pressedOutside && outside(e)) $("dlg").close(); });

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  for (const k of Object.keys(state)) if (p.get(k)) state[k] = p.get(k);
  $("q").value = state.q; $("device").value = state.device; $("genre").value = state.genre; $("rating").value = state.rating; $("sort").value = state.sort;
  chips();
}
function writeHash() {
  const p = new URLSearchParams(Object.entries(state).filter(([k, v]) => v && !(k === "sort" && v === "title")));
  history.replaceState(null, "", p.toString() ? "#" + p : location.pathname);
}

let timer;
$("q").addEventListener("input", (e) => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value; render(); }, 120); });
for (const k of ["device", "genre", "rating", "sort"]) $(k).addEventListener("change", (e) => { state[k] = e.target.value; render(); });
$("systems").addEventListener("click", (e) => {
  const c = e.target.closest(".chip"); if (!c) return;
  state.system = c.dataset.s; chips(); render();
});
$("grid").addEventListener("click", (e) => { const c = e.target.closest(".card"); if (c) open(c.dataset.id); });
$("grid").addEventListener("keydown", (e) => { if (e.key === "Enter") { const c = e.target.closest(".card"); if (c) open(c.dataset.id); } });
$("more").addEventListener("click", more);
new IntersectionObserver((es) => { if (es[0].isIntersecting && !$("more").hidden) more(); }).observe($("more"));
load();
</script>
</body>
