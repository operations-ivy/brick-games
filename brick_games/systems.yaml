# The systems in brick2000's /extra/games/roms, and where each plays.
#
#   folder:   the directory under ROMS_ROOT (a system can have several)
#   libretro: the system's name in libretro's thumbnails and database
#   igdb:     IGDB platform ids, for critic and user ratings (ratings.py)
#   rawg:     RAWG platform ids, for the Metascore; only systems Metacritic
#             reviewed (about 1995 on)
#   manuals:  Internet Archive items with one PDF manual per game (manuals.py);
#             none found for DS (names run together), Game Gear, PC Engine CD
#             or arcade
#   exts:     the game files (anything else in the folder is ignored:
#             .dat, .txt, saves, artwork, per-track .bin of a .cue game)
#   devices:  device id -> good (full speed) | ok (most games; some slow or
#             need per-game settings) | no; see `devices` below
#
# Measured 2026-11-13 on the Retroid Pocket 2+ (homelab-context docs/retroid.md);
# brick9000 from its brick-retro cores (hosts.md); the RG476H is expected, not
# measured, until it arrives.

devices:
  brick9000: {name: "brick9000", what: "the arcade cabinet (Pi 4, RetroArch)"}
  rp2plus: {name: "Retroid Pocket 2+", what: "the handheld (Daijisho)"}
  rg476h: {name: "RG476H", what: "the new handheld (expected)"}

systems:
  - id: nes
    name: "Nintendo Entertainment System"
    folders: [nes]
    libretro: "Nintendo - Nintendo Entertainment System"
    igdb: [18, 99, 51]
    manuals: [NESManuals]
    exts: [nes, fds]
    devices: {brick9000: good, rp2plus: good, rg476h: good}
  - id: snes
    name: "Super Nintendo"
    folders: [snes]
    libretro: "Nintendo - Super Nintendo Entertainment System"
    igdb: [19, 58]
    manuals: [SNESManuals]
    exts: [smc, sfc]
    devices: {brick9000: good, rp2plus: good, rg476h: good}
  - id: gb
    name: "Game Boy / Color"
    folders: [gb, gbc]
    libretro: "Nintendo - Game Boy"
    igdb: [33, 22]
    manuals: [NintendoGameBoyManuals, NintendoGameBoyColorManuals]
    exts: [gb, gbc, zip]
    devices: {brick9000: good, rp2plus: good, rg476h: good}
  - id: gba
    name: "Game Boy Advance"
    folders: [gba]
    libretro: "Nintendo - Game Boy Advance"
    igdb: [24]
    manuals: [NintendoGameBoyAdvanceManuals]
    rawg: [24]
    exts: [gba]
    devices: {brick9000: good, rp2plus: good, rg476h: good}
  - id: n64
    name: "Nintendo 64"
    folders: [n64]
    libretro: "Nintendo - Nintendo 64"
    igdb: [4]
    manuals: [Nintendo64Manuals_201812]
    rawg: [83]
