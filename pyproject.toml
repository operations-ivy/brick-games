[tool.poetry]
name = "brick-games"
version = "0.10.1"
description = "The catalog of every game ROM in the brick homelab, the devices it plays on, and its box art, at games.brick.nozdormu.cloud"
authors = ["Patrick White <whitep@alumni.vcu.edu>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pillow = "^12.0"
pyyaml = "^6.0"
prometheus-client = "^0.22.0"
brick-observe = { git = "https://github.com/operations-ivy/brick-observe.git", tag = "v0.1.1", extras = ["metrics", "tracing"] }
confluent-kafka = "^2.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry>=1.3.2"]
build-backend = "poetry.masonry.api"
