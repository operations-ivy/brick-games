# The page: serves catalog.json and the art cache, read-only. On brick2000 with
# the data volume (local-path, one node).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brick-games-web
  namespace: games
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: brick-games-web}
  template:
    metadata:
      labels: {app: brick-games-web}
    spec:
      nodeSelector:
        chuck.io/storage-node: "true"
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: web
        image: whitepatrick/brick-games
        imagePullPolicy: IfNotPresent
        args: ["web"]
        ports:
        - {name: http, containerPort: 8080}
        env:
        - {name: DATA, value: /data}
        - {name: LOG_FORMAT, value: json}
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"}
        volumeMounts:
        - {name: data, mountPath: /data, readOnly: true}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        livenessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 20
        readinessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: games-data}
---
apiVersion: v1
kind: Service
metadata:
  name: brick-games-web
  namespace: games
spec:
  selector: {app: brick-games-web}
  ports:
  - {name: http, port: 80, targetPort: http}
