# Kafka for the save sync (saves.py): one broker in KRaft mode (its own
# controller, no ZooKeeper), on brick2000 with every PV. One topic,
# saves.events, created by the saves service and kept for good: every save
# event from every device, in order per game. Small: a heap of 384 MiB.
apiVersion: v1
kind: Service
metadata:
  name: brick-games-kafka
  namespace: games
spec:
  clusterIP: None  # headless: the broker advertises its own pod name
  selector: {app: brick-games-kafka}
  ports:
  - {name: kafka, port: 9092}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: brick-games-kafka
  namespace: games
spec:
  serviceName: brick-games-kafka
  replicas: 1
  selector:
    matchLabels: {app: brick-games-kafka}
  template:
    metadata:
      labels: {app: brick-games-kafka}
    spec:
      nodeSelector:
        chuck.io/storage-node: "true"
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # the image's appuser
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: kafka
        # apache/kafka 4.3.2 (2026-10-20), pinned by digest (multi-arch: brick2000 is arm64).
        image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
        ports:
        - {name: kafka, containerPort: 9092}
        env:
        - {name: KAFKA_NODE_ID, value: "1"}
        - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
        - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://localhost:9093"}
        - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://brick-games-kafka-0.brick-games-kafka.games.svc.cluster.local:9092"}
        - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
        - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
        - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
        - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
        - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
        - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
        - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
        - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
        - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
        - {name: KAFKA_HEAP_OPTS, value: "-Xms384m -Xmx384m"}
        # Fixed, so the volume's metadata and the broker always agree.
        - {name: CLUSTER_ID, value: "87U4M2sbSYGYEVrwa8yKXg"}
        volumeMounts:
        - {name: data, mountPath: /var/lib/kafka/data}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: 50m, memory: 512Mi}
          limits: {memory: 768Mi}
        readinessProbe:
          tcpSocket: {port: kafka}
          periodSeconds: 10
        livenessProbe:
          tcpSocket: {port: kafka}
          initialDelaySeconds: 60
          periodSeconds: 30
  volumeClaimTemplates:
  - metadata:
      name: data
      annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests: {storage: 2Gi}
