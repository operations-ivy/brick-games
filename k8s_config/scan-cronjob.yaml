# The nightly scan: reads brick2000's ROM tree (read-only, names only), fetches
# art from libretro's thumbnail repos on GitHub and manuals from the Internet
# Archive into the library on the drive (/extra/brick-games: outside the Samba
# share and brick9000's ROM sync), facts from libretro and ratings from IGDB
# and RAWG, then writes catalog.json and the art cache on the data volume.
# One run at a time; a run that can't reach a source still lists every game
# and the art already kept. Without the drive it fails and leaves the catalog. The ratings keys come from the
# brick-games-ratings SealedSecret (brick-k8s-secrets); without it, no ratings.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: brick-games-scan
  namespace: games
spec:
  schedule: "30 3 * * *"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app: brick-games-scan
        spec:
          restartPolicy: Never
          # The ROMs are on brick2000's USB drive, and so is the data volume.
          nodeSelector:
            chuck.io/storage-node: "true"
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
          # The drive is exFAT, mounted for uid 1000 only, so the app runs as 1000;
          # until 0.7.0 it ran as 65532, and this gives the data volume's files to
          # 1000 (a no-op once they are).
          - name: own-data
            image: whitepatrick/brick-games
            imagePullPolicy: IfNotPresent
            command: ["sh", "-c", "find /data ! -user 1000 -exec chown -h 1000:1000 {} +"]
            volumeMounts:
            - {name: data, mountPath: /data}
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"], add: ["CHOWN", "DAC_READ_SEARCH"]}
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {memory: 64Mi}
          containers:
          - name: scan
            image: whitepatrick/brick-games
            imagePullPolicy: IfNotPresent
            args: ["scan"]
            env:
            - {name: ROMS_ROOT, value: /roms}
            - {name: DATA, value: /data}
            - {name: LIBRARY, value: /library}
            - {name: LOG_FORMAT, value: json}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"}
            - {name: PUSHGATEWAY_URL, value: "http://pushgateway-prometheus-pushgateway.monitoring.svc.cluster.local:9091"}
            # IGDB_CLIENT_ID, IGDB_CLIENT_SECRET, RAWG_KEY
            envFrom:
            - secretRef: {name: brick-games-ratings, optional: true}
            volumeMounts:
            - {name: roms, mountPath: /roms, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: library, mountPath: /library}
            - {name: tmp, mountPath: /tmp}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests: {cpu: 50m, memory: 256Mi}
              limits: {cpu: "1", memory: 1Gi}
          volumes:
          - name: roms
            hostPath: {path: /extra/games/roms, type: Directory}
          - name: library
            hostPath: {path: /extra/brick-games, type: Directory}
          - name: data
            persistentVolumeClaim: {claimName: games-data}
          - name: tmp
            emptyDir: {medium: Memory, sizeLimit: 64Mi}
